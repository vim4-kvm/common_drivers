name: VIM4 kernel
on:
  push:
    branches: [vim4-kvm-5.15]
    tags: ['release-*']
  pull_request:
    branches: [vim4-kvm-5.15]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified kernel package
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  driver-regression:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 drivers/usb/crg/test_setup_events.py
      - run: python3 drivers/media_modules/frame_sink/encoder/multi/test_shared_clock.py
      - run: python3 drivers/media/vin/tvin/vdin/test_hdr_output.py
      - run: python3 drivers/media/vin/tvin/vdin/test_secondary_hdmi.py
      - run: python3 drivers/media/enhancement/amvecm/test_hdmi_metadata.py
      - run: python3 drivers/media/vout/hdmitx21/test_avi_hdr.py
  kernel:
    needs: driver-regression
    uses: vim4-kvm/vim4-kvm/.github/workflows/kernel.yml@main
    permissions:
      contents: write
    with:
      repository: common_drivers
      publish: ${{ startsWith(github.ref, 'refs/tags/release-') || inputs.publish == true }}
